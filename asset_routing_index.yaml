# ============ 检索规则（三层命中合并） ============
rules:
  layer1_exact: "领域+行业+场景 全匹配 → 优先返回（案例/场景显式命中）"
  layer2_default: "领域匹配 + 行业缺省全行业 → 次优先（通用工具/案例）"
  layer3_fuzzy: "次领域命中 / 意图匹配 → 兜底"
  sort: "精确 > 缺省 > 模糊 · 去重"
  intent_route: "P2-1 场景路由：意图5 × 领域8 矩阵（见 action-orders 附录）"
  gap_check: "路由后无资产覆盖 → §13 缺口检测 → Infoseek 调研 → [置信度] 标注"
