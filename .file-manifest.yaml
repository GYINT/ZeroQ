# QCM 子层级治理元数据（V2.0 · 2026-08-18 镜像 · 真实态）
# 机制：5 态状态机（🟢孵化 → 🔵活跃 → 🟡稳定 → ⚪归档 → 🗑️淘汰）
# 说明：V2.0 按实际目录结构重写（V1.0 为规划态，knowledge/assets/scripts-tests 未落地已删除）
version: 2.0
root:
  status: stable
  capacity: {max: 8, current: 4}
  rules: [publish_only]
  note: 根级发布文档（DEPENDENCIES.md / API_KEYS.md / PLATFORM.md / LICENSE · 对外声明）
subdirs:
  core:
    status: stable
    capacity: {max: 20, current: 13}
    rules: [read_only, entry_point_only]
    note: 核心引擎（router/assembler/validator/component_scan/component_index/gap_detector/hit_tracker/key_manager/ambiguity_resolver/capacity/guardian/guardian_reverse/intent_calibrator）
  components:
    status: active
    capacity: {max: 35, current: 29}
    rules: [manifest_required, heat_tracked]
    note: 组件池（热度 new→active→stable · core/component_scan.py 自动统计 · V8.7 并入 intent-glossary）
  outputs:
    status: stable
    capacity: {max: 6, current: 5}
    rules: [form_frozen]
    note: 4 形态模板（唯一真源）+ 待办文档（QCM-优化升级待办.md）
  references:
    status: active
    capacity: {max: 90, current: 82}
    rules: [append_only, bidirectional_ref]
    note: 知识/协议/配置（13 子目录：protocol/config/tools/scenarios/methods/people/contract/governance/knowledge/testing/planning/prompts/industry · industry 为规模化行业知识包 · config 含 guardian 守卫注册中心 + source_links 词源映射）
  scripts:
    status: active
    capacity: {max: 35, current: 35}
    rules: [runtime_only]
    note: 运行脚本（30 py + config.example.yaml + env_restore.sh · 测试已迁 tests/）
  tests:
    status: active
    capacity: {max: 50, current: 46}
    rules: [version_merge, no_runtime_import]
    note: 测试归档（basic/protocol/engines/v82 + router_golden + scene_route_6 + run_all 串联）
  deploy:
    status: stable
    capacity: {max: 20, current: 17}
    rules: [ops_only]
    note: 运维资产（docker/k8s/monitoring/api · deploy.sh 一键部署脚本）
  docs:
    status: stable
    capacity: {max: 12, current: 5}
    rules: [append_only]
    note: CHANGELOG/INSTALL/TROUBLESHOOTING/eval + archive/（内部开发史脱敏归档）
  domains:
    status: stable
    capacity: {max: 6, current: 2}
    rules: [append_only]
    note: 行业适配 + 扩展指南
  plugins:
    status: active
    capacity: {max: 10, current: 1}
    rules: [manifest_required]
    note: 插件扩展（echo_tool 样例 · PluginLoader 热加载）
  archive:
    status: permanent
    rules: [one_way_in, retention_2_cycles]
    note: 归档（deprecated/旧版 · 头注重定向 · 见 archive/README.md）
guards:
  reference_check: true
  deprecation_check: true
  capacity_check: true
  nesting_check: true
  hardcode_check: true
  cross_skill_check: true
