    dep: ['case-application.md']
    mandatory: true
    status: stable
  _probe:
  _probe:
    category: analysis
    forms: [case_application]
    skeletons: [crisis]
    ref: action-orders §2.1
    mandatory: false
    status: stable
  _decision_row:
