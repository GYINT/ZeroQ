# QCM 输出组件注册表（V8.3 · 组件池单一真源 · 防模板爆炸）
# 协议：action-orders §14 路由 + 输出层 4 形态 · 组件=协议层章节的"输出形态"
# 状态：defined=已定义（段落仍在母模板）· extracted=已切分独立文件 · archived=归档
# 热度：new/active/stable/archived（复用 §11 生命周期 · qcm_component_scan.py 自动统计）
# 容量约束：组件池 ≤35（超限触发合并评审）
version: 1.0

components:
  # ============ 公共组件（跨 3+ 形态复用） ============
  _meta:
    category: analysis
    forms: [case_application, decision_card, assessment_report, quick_response]
    skeletons: [crisis, improve, assess, knowledge, culture, distill]
    ref: action-orders 输出层通用
    mandatory: true
    status: stable
  intent-glossary:   # A+B 落地（V8.7）：意图×形态规范真源（并入输出组件类）
    category: analysis
    forms: [case_application, decision_card, assessment_report, quick_response]
    skeletons: [crisis, improve, assess, knowledge, culture, distill]
    ref: core/ambiguity_resolver.py INTENTS + core/router.py FORM_MAP
    mandatory: false
    status: new
  _route:
    category: analysis
    forms: [case_application, decision_card, assessment_report]
    skeletons: [crisis, improve, assess, knowledge, culture, distill]
    ref: action-orders §14
    mandatory: false
    status: new          # V8.3 新增：路由元数据消费（意图/领域/置信度/缺口）
  _action_items:
    category: output
    forms: [case_application, decision_card]
    skeletons: [crisis, improve, culture]
    ref: action-orders §1.1
    dep: ['case-application.md']
    mandatory: true
    status: stable
  _measures:
  _measures:
    category: output
    forms: [case_application, decision_card, assessment_report]
    skeletons: [crisis, improve, assess, culture]
    ref: action-orders §1.3
    dep: ['case-application.md']
    mandatory: true
    status: stable
  _dual_zero:
  _dual_zero:
    category: output
    forms: [case_application, decision_card, assessment_report]
    skeletons: [crisis, improve, assess, culture]
    ref: action-orders §3.4
    dep: ['case-application.md']
    mandatory: true
    status: stable
  _followup:
  _followup:
    category: output
    forms: [case_application, assessment_report, quick_response]
    skeletons: [crisis, improve, assess, culture]
