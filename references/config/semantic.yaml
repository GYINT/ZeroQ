# QCM 语义检测配置（V8.4 词源解耦级 2 · semantic_audit 词典外置）
# 用途：词源同类语义检测的规则数据（互补指标/已确认对/检测参数）由本文件驱动
# 维护：编辑本文件即可扩展检测，无需改代码

# 互补指标（量纲互补/反义 · 与同义区分 · 检测④）
complementary_pairs:
  - [良率, 不良率]
  - [合格率, 不合格率]
  - [直通率, 废品率]
  - [一次合格率, 一次不良率]
  - [准时交付率, 延误率]

# 已人工确认"合理分流"的关系对（检测→确认闭环 · 降级为提示不再计严重）
confirmed_pairs:
  - [损耗, 损耗率]
  - [良率, 不良率]
  - [微裂纹, 裂纹]
  - [不合格, 不合格率]
  - [标准, 标准化]          # 标准=④知识学习（标准是什么）· 标准化=②流程优化（建立标准）——合理分流
  - [标准, 标准适宜性]      # 标准=④知识学习 · 标准适宜性=③评估审计（标准是否适用）——合理分流（四性评估维度）

# 检测参数（近拼编辑距离 / 同根跨意图长度差阈值 / 归一化覆盖率告警线）
params:
  confusable_edit_dist: 1        # 编辑距离 ≤1 → 近拼易混
  same_root_len_diff: 3          # 同根跨意图：长词-短词 ≤3 字
  min_word_len: 3                # 近拼检测最短词长（<3 跳过）
  coverage_warn_pct: 10          # SYNONYM_MAP 覆盖率 <10% → 建议补全
