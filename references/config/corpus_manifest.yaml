  - {rel: references/scenarios/events/QE-2026-002.md, level: chapter, group: 事件证据族, freq: low, note: "事件归零资产化入口（归一化·route-aware）"}
excluded:
  - {rel: references/testing/test-cases.md, note: "测试案例库（>30KB）", reason: "测试资产·非运行语料·仅经索引锚点按需检索·不走全量懒加载"}
  - {rel: references/scenarios/events/README.md, note: "事件归一化入口目录说明（目录描述·非内容承载；P3 检索面由 enroll_corpus 生成 <event_id>.md 实际承载）", reason: "目录描述符·非语料内容；登记为 known 以规避 config_sync 孤儿误报，索引仅锚点结构"}
