  - {rel: references/knowledge/knowledge-base.md, level: chapter, group: 知识族, freq: low, note: "知识库（案例集/外部素材）"}
  - {rel: references/tools/masters.md, level: chapter, group: 知识族, freq: low, note: "大师库（21 位质量大师心智模型）"}
  - {rel: references/scenarios/cases.md, level: chapter, group: 知识族, freq: low, note: "案例库（双归零/行业案例）"}
  - {rel: references/protocol/action-orders.md, level: chapter, group: 协议族, freq: high, note: "协议章（AO-1~AO-4/5 段式/危机协议/§14 路由协议 · 按章懒加载）"}
  - {rel: references/knowledge/business-communication-hourensou.md, level: chapter, group: 知识族, freq: low, note: "报告·联络·商谈（报连相）与 PDCA 指示确认流程"}
  - {rel: references/knowledge/design-planning-scenarios.md, level: chapter, group: 知识族, freq: low, note: "设计/规划场景库（NPI/APQP + 产品规划 · P0-2 场景补全）"}
  - {rel: references/knowledge/material-mapping.md, level: chapter, group: 知识族, freq: low, note: "外部素材映射库（PPT→QCM 模块 · 触发路由）"}
  - {rel: references/knowledge/multi-dimension-case-application.md, level: chapter, group: 知识族, freq: low, note: "工具案例五维交叉输出模板"}
  - {rel: references/knowledge/extension.md, level: chapter, group: 知识族, freq: low, note: "扩展接口规范（七接口 A–G）· F 接口外部知识蒸馏与挂载使用指引"}
  - {rel: references/knowledge/supplementary.md, level: chapter, group: 知识族, freq: low, note: "补充知识索引（人物/方法/规划/治理 25 篇孤儿文档反向链接汇总）"}
