#   category      分类（一致性 / 可靠性 / 稳定性 / 盲区 / 死代码 / 双路漂移 / 生命周期）
#   severity      critical / high / medium / low
#   status        open / registered / normalized / watched / resolved / retired
#   detection     发现方式（manual / audit / guard）
#   registered_at 登记时间
#   normalized    是否已归一化注册（true / false）
#   evidence      证据（文件 / 行 / 命令）
#   fix           建议修复
#   target_guard  建议接入的守卫 id（治理闭环落点）

