# QCM MCP Server Helm Values (V1.0)

replicaCount: 2

image:
  repository: qcm/mcp-server
  tag: "1.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  hosts:
    - host: qcm.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - qcm.example.invalid
      secretName: qcm-mcp-tls

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

probes:
  liveness:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

env:
  # LLM Provider API Keys (从 secret 引用)
  - name: DEEPSEEK_API_KEY
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: deepseek-api-key
        optional: true
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: openai-api-key
        optional: true
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: anthropic-api-key
        optional: true
  - name: DASHSCOPE_API_KEY
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: dashscope-api-key
        optional: true
  # Auth
  - name: QCM_REQUIRE_TOKEN
    value: "1"
  - name: QCM_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: auth-token
  - name: QCM_JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: qcm-secrets
        key: jwt-secret
  # Cache & Performance
  - name: QCM_CACHE_DIR
    value: "/var/cache/qcm"
  - name: QCM_LLM_CACHE
    value: "1"
  - name: QCM_RATELIMIT_PER_IP
    value: "100"
  # Hot reload
  - name: QCM_WATCH_CORPUS
    value: "1"
  - name: QCM_WATCH_INTERVAL
    value: "30"

volumes:
  - name: cache
    emptyDir:
      sizeLimit: 1Gi
  - name: audit
    persistentVolumeClaim:
      claimName: qcm-audit-pvc

volumeMounts:
  - name: cache
    mountPath: /var/cache/qcm
  - name: audit
    mountPath: /var/log/qcm-mcp

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
