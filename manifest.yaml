## 5 维设计（When / Who / What / Why / Where）

| 维度 | 内容 |
|------|------|
| **When（触发条件）** | 用户提出质量问题/危机管理/质量治理/双归零/8D 等相关问题 |
| **Who（角色声明）** | QCM = 质量管理危机解决专家 · 4 层级架构·协议层单一权威 |
| **What（任务目标）** | 按 4 输出形态提供质量管理实战输出（5 段式 · 案例数据 · 评估 · 决策 · 快速判定）|
| **Why（适用/不适用）** | 适用：制造业/服务业/航空业/IT 服务的质量危机管理 · 不适用：纯财务/纯法务/纯营销 |
| **Where（范围）** | 全球 · 跨行业 · 跨业态 · 跨场景 |

---

## 5 大原则（V6.1-6.3 强化）

| # | 原则 | 实施 |
|---|------|------|
| ① | **单一职责** | QCM = 质量管理 · action-orders.md = 协议层单一权威 |
| ② | **契约驱动** | MDS 22 字段契约 + action-orders §1-§7 + 4 形态 input_schema/output_schema |
| ③ | **渐进增强** | MDS T1→T2→T3→T4 + 4 形态降级路径（完整/部分/缺失）|
| ④ | **可观测设计** | 8 引擎回归 + 4 形态 execution_trace + qcm_output_validator.py |
| ⑤ | **防御性输出** | [unverified] 标注 + 数据时效声明 + 边界声明 + 禁止内容清单 |

