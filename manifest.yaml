# QCM Skill Manifest（与 SKILL.md frontmatter 双绑）

> **同步机制**：本文件与 SKILL.md frontmatter 字节级一致
> **同步命令**：`python3 scripts/sync_manifest.py`
> **依据**：Infoseek Skill v1.5.0+ Manifest 双绑规范

---

## Skill 元数据

```yaml
name: QCM
