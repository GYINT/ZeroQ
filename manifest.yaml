## 集成接口（V7.0 规划）

```yaml
v7_integration:
  mcp_server:
    name: qcm_mcp_server
    transport: [stdio, SSE]
    tools:
      - qcm_search       # 场景搜索
      - qcm_research     # 端到端调研
      - qcm_evaluate     # 评估报告生成
      - qcm_decide       # 决策卡片生成
      - qcm_audit        # 案例库审查
      - qcm_validate     # 架构验证
  infoseek_integration:
    trigger: 场景库未覆盖时（per SKILL.md §七）
    interface:
      - qcm_research → infoseek_research (端到端)
      - qcm_search → infoseek_anchor_score (锚点评分)
      - qcm_validate → infoseek_conflict_detection (冲突检测)
    data_flow:
      - input: QCM 未覆盖场景
      - process: Infoseek 锚点发现 + 采集 + 融合
      - output: 调研报告 → QCM 消化入库
```

