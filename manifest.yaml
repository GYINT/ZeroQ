## 意图描述（intent · 4 段式）

```yaml
intent:
  is: |
    QCM 是质量管理问题解决 Skill，提供 4 层级架构（输出/协议/输入/底层），
    5 段式输出结构（行动要项/事态导航/危机沟通/行动措施/双归零+后续计划），
    4 输出形态（案例应用/决策卡片/评估报告/快速响应），
    通过严格分离原则消除冗余，通过 8 引擎回归保证质量。
  solves:
    - 质量危机响应（D≥4 触发 AO-1 围堵）
    - 质量问题根因（5Why / 8D / 三链）
    - 质量治理水平评估（L4 4 层 × N 维度评分）
    - 质量决策快速判定（D 总分 + ITIL P）
    - 跨行业质量方案（汽车/航空/电子/服务）
  applicable:
    - 制造业（汽车/航空/半导体/精密）
    - 服务业（零售/餐饮/IT）
    - 跨业态质量危机管理
    - 体系成熟度评估
  not_applicable:
    - 纯财务问题（无质量维度）
    - 纯法务问题（合规以外）
    - 纯营销问题（无质量/工艺）
    - 单一工具问答（用工具库而非 QCM）
```

