## 副作用声明（side_effects · V6.1）

```yaml
side_effects:
  output_forms:
    case_application:
      changes: 无副作用（仅输出文本）
      rollback: 不适用
      idempotent: true (可重读)
    decision_card:
      changes: 无副作用（仅输出决策）
      rollback: 不适用
      idempotent: true
    assessment_report:
      changes: 评分记录写入 governance.md 历史
      rollback: 撤销历史记录
      idempotent: false (重复评分会覆盖)
    quick_response:
      changes: 判定记录可追溯
      rollback: 不适用
      idempotent: true
  data_pollution:
    - 评估报告（assessment_report）写入 governance.md 历史记录 → 需保留
  resource_leak:
    - 无外部资源占用
  state_pollution:
    - 上下文快照不可变（每次调用独立）
```

