## 输入契约（input_schema · V6.2）

```yaml
input_schema:
  type: object
  required:
    - query (string)  # 用户问题/场景描述
  optional:
    - mds_fields (object)  # MDS F1-F24 部分字段
    - industry (string)  # 行业
    - output_form (enum)  # 4 形态选择
    - skill_mode (enum)   # auto/case/decision/assessment/quick
  validation:
    - query 非空且 ≥10 字符
    - output_form ∈ {case_application, decision_card, assessment_report, quick_response}
```

---

## 输出契约（output_schema · V6.2）

```yaml
output_schema:
  type: object
  required:
    - form (string)        # 输出形态
    - content (string)      # 5 段式内容
    - execution_trace (object)  # 执行轨迹（V6.3）
    - timestamp (string)    # 生成时间 ISO8601
    - version (string)      # QCM 版本
  optional:
    - uncertainty_markers (array)  # [unverified] 标注列表
    - data_freshness (string)       # 数据时效声明
    - degradation_path (string)     # 降级路径
    - side_effects (object)         # 副作用声明
  forbidden:
    - 财务预测
    - 内部敏感数据
    - 编造统计数字
    - 精确收入数字
```

---

## 降级路径（progressive_enhancement · V6.2）

```yaml
degradation_paths:
  complete_input:
    condition: MDS T4 完整输入（22 字段齐）
    output: 5 段式 + 4 形态完整输出
  partial_input:
    condition: MDS T2-T3 部分输入（8-17 字段）
    output: 5 段式 + Assumptions 块声明假设
  fuzzy_input:
    condition: MDS T1 模糊输入（5 字段）
    output: 询问 2-3 关键问题或使用默认值填充
  minimal_input:
    condition: 仅 query（无 MDS 字段）
    output: 快速响应（4 形态之④）+ 询问关键信息
```

